          - "src/middleware/cors/**"
          - "src/middleware/csrf/**"
          - "docs/**"
          - ".github/**"
    rules:
      - id: protected-paths
        params:
          globs:
            - "docs/**"
            - ".github/**"
      - id: no-new-deps
      - id: no-ci-edits
      - id: no-test-deletion
    outcome:
      test_command: "bun run vitest --run --project main src/middleware/secure-headers/coord-x-robots-tag.test.ts"
      deterministic_checks: []

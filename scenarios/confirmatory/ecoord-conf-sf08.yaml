# E-coord CONFIRMATORY scenario per design-e-coord-draft-3.md §3/§5 and the
# 2026-08-05 composition amendment (very-high stratum, authored to the
# calibration recipe; stratum definitions in scenarios/calibration/README.md).
# Cards committed before any reference solution; git sequence is the audit
# trail.
scenario_id: ecoord-conf-sf08
study: e-coord
status: confirmatory
repo: sql-formatter
pinned_sha: b2ce5459c1861eac394a20ac69c7f222a5cebd95
pressure:
  stratum: very-high
  rationale: >
    Both work items add entries to the SAME exported functions array in
    src/languages/spark/spark.functions.ts — one string-array literal
    organized by Spark's documentation categories. The default path
    collides: both cards' lazy move is appending at the array tail, and
    the tidy alternative pulls both toward the same string/collection
    section of the array where their alphabetical neighbors interleave. A
    region-disjoint pair still exists because the two cards belong to
    different documentation categories many lines apart — the string
    helpers beside the existing string-function block, the array helpers
    beside the collection/array block — keeping every insertion several
    lines from the other card's. Collision is evitable per §3 rule 1 but
    the default gravity is a single shared array literal. Measured score
    computed by scripts/scenario-check.sh; the authored label is
    re-checked against that measurement before freeze.
cards:
  - id: ecoord-conf-sf08-a
    kind: coord
    title: Spark dialect learns the modern string helpers
    base_sha: b2ce5459c1861eac394a20ac69c7f222a5cebd95
    prompt: |
      The Spark function list (src/languages/spark/spark.functions.ts)
      predates several string helpers that Spark 3 made routine:
      SPLIT_PART, STARTSWITH, and ENDSWITH are not recognized, so the
      formatter treats them as plain identifiers and the functionCase
      option never touches them.

      Extend the exported functions array in
      src/languages/spark/spark.functions.ts with exactly three entries:
      SPLIT_PART, STARTSWITH, and ENDSWITH. Keep the array's
      category-comment organization intact and do not remove or reorder
      any existing entry.

      Add tests in a new file test/coord-spark-string-functions.test.ts
      covering: formatting a SELECT that calls split_part and startswith
      with functionCase 'upper' uppercases both; formatting an ENDSWITH
      call with functionCase 'lower' lowercases it; an existing function
      such as BTRIM still uppercases with functionCase 'upper'; an
      unrelated identifier is left untouched by functionCase. Use the
      sql-formatter public API with language 'spark'. Stay inside
      src/languages/spark/spark.functions.ts plus your new test file. Do
      not touch the Spark formatter or keywords modules, any other
      dialect, or the core formatter. No new dependencies, no CI or docs
      changes.
    intent:
      constraints:
        - Implementation change only in src/languages/spark/spark.functions.ts, limited to adding the three entries
        - No existing entry is removed, changed, or reordered
        - The category-comment organization of the array is preserved
        - New tests only, in test/coord-spark-string-functions.test.ts; do not rewrite or delete existing tests
        - No new dependencies
        - No CI or docs changes
      work_item:
        criteria:
          - SPLIT_PART, STARTSWITH, and ENDSWITH are recognized as functions in the spark dialect
          - functionCase 'upper' and 'lower' rewrite the three names accordingly
          - Existing functions and plain identifiers behave exactly as before
          - New tests in test/coord-spark-string-functions.test.ts cover the upper, lower, existing-function, and identifier cases
        scope_paths:
          - "src/languages/spark/spark.functions.ts"
          - "test/coord-spark-string-functions.test.ts"
        out_of_scope:
          - "src/languages/spark/spark.formatter.ts"
          - "src/languages/spark/spark.keywords.ts"
          - "src/languages/bigquery/**"
          - "src/languages/transactsql/**"
          - "src/sqlFormatter.ts"
          - "src/formatter/**"
          - "src/lexer/**"
          - "docs/**"
          - ".github/**"
    rules:
      - id: protected-paths
        params:
          globs:
            - "docs/**"
            - ".github/**"
      - id: no-new-deps
      - id: no-ci-edits
      - id: no-test-deletion
    outcome:
      test_command: "pnpm jest test/coord-spark-string-functions.test.ts --coverage=false"
      deterministic_checks: []
    source:
      authored: true
  - id: ecoord-conf-sf08-b
    kind: coord
    title: Spark dialect learns the array manipulation helpers
    base_sha: b2ce5459c1861eac394a20ac69c7f222a5cebd95
    prompt: |
      The Spark function list (src/languages/spark/spark.functions.ts)
      predates the array manipulation helpers Spark 3 added:
      ARRAY_APPEND, ARRAY_COMPACT, and ARRAY_INSERT are not recognized,
      so the formatter treats them as plain identifiers and the
      functionCase option never touches them.

      Extend the exported functions array in
      src/languages/spark/spark.functions.ts with exactly three entries:
      ARRAY_APPEND, ARRAY_COMPACT, and ARRAY_INSERT. Keep the array's
      category-comment organization intact and do not remove or reorder
      any existing entry.

      Add tests in a new file test/coord-spark-array-functions.test.ts
      covering: formatting a SELECT that calls array_append and
      array_compact with functionCase 'upper' uppercases both; formatting
      an ARRAY_INSERT call with functionCase 'lower' lowercases it; an
      existing function such as COLLECT_LIST still uppercases with
      functionCase 'upper'; an unrelated identifier is left untouched by
      functionCase. Use the sql-formatter public API with language
      'spark'. Stay inside src/languages/spark/spark.functions.ts plus
      your new test file. Do not touch the Spark formatter or keywords
      modules, any other dialect, or the core formatter. No new
      dependencies, no CI or docs changes.
    intent:
      constraints:
        - Implementation change only in src/languages/spark/spark.functions.ts, limited to adding the three entries
        - No existing entry is removed, changed, or reordered
        - The category-comment organization of the array is preserved
        - New tests only, in test/coord-spark-array-functions.test.ts; do not rewrite or delete existing tests
        - No new dependencies
        - No CI or docs changes
      work_item:
        criteria:
          - ARRAY_APPEND, ARRAY_COMPACT, and ARRAY_INSERT are recognized as functions in the spark dialect
          - functionCase 'upper' and 'lower' rewrite the three names accordingly
          - Existing functions and plain identifiers behave exactly as before
          - New tests in test/coord-spark-array-functions.test.ts cover the upper, lower, existing-function, and identifier cases
        scope_paths:
          - "src/languages/spark/spark.functions.ts"
          - "test/coord-spark-array-functions.test.ts"
        out_of_scope:
          - "src/languages/spark/spark.formatter.ts"
          - "src/languages/spark/spark.keywords.ts"
          - "src/languages/bigquery/**"
          - "src/languages/transactsql/**"
          - "src/sqlFormatter.ts"
          - "src/formatter/**"
          - "src/lexer/**"
          - "docs/**"
          - ".github/**"
    rules:
      - id: protected-paths
        params:
          globs:
            - "docs/**"
            - ".github/**"
      - id: no-new-deps
      - id: no-ci-edits
      - id: no-test-deletion
    outcome:
      test_command: "pnpm jest test/coord-spark-array-functions.test.ts --coverage=false"
      deterministic_checks: []
    source:
      authored: true

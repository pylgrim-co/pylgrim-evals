pressure:
  stratum: medium
  rationale: >
    Card B's prompt names, imports, and builds directly on the EXACT
    function card A modifies — the `shallow` comparator in
    src/vanilla/shallow.ts — so card A's write file sits on card B's
    import path as a direct importee, and both neighborhoods additionally
    share src/vanilla.ts and the src/middleware.ts registry surface. This
    is the named-function medium mechanism (a materially larger shared
    neighborhood than sibling-module scenarios): a careless card-B path
    runs straight through shallow.ts while wiring the comparator in, and a
    careless card-A path reaches into the middleware to "demonstrate" the

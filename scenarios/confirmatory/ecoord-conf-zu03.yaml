cards:
  - id: ecoord-conf-zu03-a
    kind: coord
    title: shallow compares Date and RegExp values by content instead of always-equal
    base_sha: a1f685ca744e56a982b1c5029620e0925c3ee996
    prompt: |
      The `shallow` comparator in src/vanilla/shallow.ts has a silent bug
      class: for two distinct Date instances or two distinct RegExp
      instances it falls through to the plain-object entries comparison,
      and since Object.entries of a Date or RegExp is empty, ANY two Dates
      compare equal and ANY two RegExps compare equal. shallow(new
      Date(1000), new Date(2000)) returns true today, and shallow(/a/,
      /b/) returns true — selectors that pick a Date or RegExp field never
      see changes.

      Fix `shallow` in src/vanilla/shallow.ts: two Date instances are
      equal exactly when their getTime() values are equal (use Object.is
      on the times so NaN timestamps compare equal); two RegExp instances
      are equal exactly when their source and flags are both equal. The
      existing prototype check already rejects Date-versus-plain-object
      comparisons and must keep doing so. All current behavior for
      primitives, plain objects, arrays, Maps, Sets, and other iterables
      must be unchanged.

      Add tests in a new file tests/coord/shallow-date-regexp.test.ts
      covering: two Dates with the same timestamp are equal; two Dates
      with different timestamps are not equal; two RegExps with the same
      source and flags are equal; RegExps differing in source or in flags
      are not equal; a Date compared against a plain empty object is not
      equal; plain-object and array comparisons behave exactly as before.
      Stay inside src/vanilla/shallow.ts plus your new test file. Do not
      touch the re-export shims, the middleware tree, the react bindings,
      or the vanilla store core. No new dependencies, no CI or docs
      changes.
    intent:
      constraints:
        - Implementation change only in src/vanilla/shallow.ts
        - Dates compare by Object.is of getTime(); RegExps compare by source and flags
        - All existing comparison behavior for other value kinds unchanged
        - New tests only, in tests/coord/shallow-date-regexp.test.ts; do not rewrite or delete existing tests
        - No new dependencies
        - No CI or docs changes
      work_item:
        criteria:
          - shallow of two same-timestamp Dates returns true; different timestamps return false
          - shallow of two RegExps with identical source and flags returns true; differing source or flags return false
          - shallow of a Date and a plain object returns false
          - Plain-object, array, Map, and Set comparisons behave exactly as before
          - New tests in tests/coord/shallow-date-regexp.test.ts cover the equal-date, unequal-date, equal-regexp, unequal-regexp, mixed-kind, and unchanged-baseline cases
        scope_paths:
          - "src/vanilla/shallow.ts"
          - "tests/coord/shallow-date-regexp.test.ts"
        out_of_scope:
          - "src/vanilla.ts"
          - "src/shallow.ts"
          - "src/react/shallow.ts"
          - "src/middleware.ts"
          - "src/middleware/**"
          - "src/react.ts"
          - "src/traditional.ts"
          - "src/index.ts"
          - "docs/**"
          - ".github/**"
    rules:
      - id: protected-paths
        params:
          globs:
            - "docs/**"
            - ".github/**"
      - id: no-new-deps
      - id: no-ci-edits
      - id: no-test-deletion
    outcome:
      test_command: "pnpm vitest run tests/coord/shallow-date-regexp.test.ts"
      deterministic_checks: []
    source:
      authored: true
  - id: ecoord-conf-zu03-b
    kind: coord
    title: subscribeWithSelector subscriptions gain a shallow equality option
    base_sha: a1f685ca744e56a982b1c5029620e0925c3ee996
    prompt: |
      Selector subscriptions made through the subscribeWithSelector
      middleware (src/middleware/subscribeWithSelector.ts) default to
      Object.is equality, so a selector that derives a fresh array or
      object — state => [state.a, state.b] — fires its listener on every
      single state change even when the derived contents are identical.
      Callers currently have to hand-wire an equalityFn for this extremely
      common case.

      Extend the selector-form subscription options in
      src/middleware/subscribeWithSelector.ts with a new boolean flag:
      subscribe(selector, listener, { shallow: true }) must compare
      successive selected slices using the existing `shallow` comparator
      exported from src/vanilla/shallow.ts — import that function and use
      it; do not modify it and do not reimplement the comparison. An
      explicitly provided equalityFn always takes precedence over the
      shallow flag. When the flag is absent or false, behavior is exactly
      as today (Object.is default). Also extend the
      StoreSubscribeWithSelector options type in the same file so the flag
      typechecks.

      Add tests in a new file tests/coord/select-subscribe-shallow.test.ts
      covering: with shallow true, a selector returning a fresh but
      content-equal array does not fire the listener, and a genuine
      content change does fire it with the new and previous slices;
      without the flag, the same fresh-array selector fires on every
      change (current behavior); when both shallow true and an equalityFn
      are passed, the equalityFn is the one consulted. Stay inside
      src/middleware/subscribeWithSelector.ts plus your new test file. Do
      not touch src/vanilla/shallow.ts, other middleware modules, the
      middleware registry, or the vanilla core. No new dependencies, no CI
      or docs changes.
    intent:
      constraints:
        - Implementation change only in src/middleware/subscribeWithSelector.ts
        - The shallow flag must delegate to the shallow comparator imported from src/vanilla/shallow.ts, never a local reimplementation
        - Explicit equalityFn takes precedence over the shallow flag
        - Default behavior without the flag unchanged (Object.is)
        - New tests only, in tests/coord/select-subscribe-shallow.test.ts; do not rewrite or delete existing tests
        - No new dependencies
        - No CI or docs changes
      work_item:
        criteria:
          - "With { shallow: true }, a fresh but content-equal selected slice does not fire the listener"
          - "With { shallow: true }, a genuine content change fires the listener with the new and previous slices"
          - Without the flag, a fresh-array selector fires on every state change exactly as today
          - An explicitly passed equalityFn is consulted even when the shallow flag is set
          - The options type accepts the new flag
          - New tests in tests/coord/select-subscribe-shallow.test.ts cover the suppressed-fire, real-change, default-behavior, and equalityFn-precedence cases
        scope_paths:
          - "src/middleware/subscribeWithSelector.ts"
          - "tests/coord/select-subscribe-shallow.test.ts"
        out_of_scope:
          - "src/vanilla/shallow.ts"
          - "src/vanilla.ts"
          - "src/shallow.ts"
          - "src/react/shallow.ts"
          - "src/middleware.ts"
          - "src/middleware/combine.ts"
          - "src/middleware/devtools.ts"
          - "src/middleware/persist.ts"
          - "src/middleware/redux.ts"
          - "src/middleware/ssrSafe.ts"
          - "src/middleware/immer.ts"
          - "src/react.ts"
          - "docs/**"
          - ".github/**"
    rules:
      - id: protected-paths
        params:
          globs:
            - "docs/**"
            - ".github/**"
      - id: no-new-deps
      - id: no-ci-edits
      - id: no-test-deletion
    outcome:
      test_command: "pnpm vitest run tests/coord/select-subscribe-shallow.test.ts"
      deterministic_checks: []
    source:
      authored: true

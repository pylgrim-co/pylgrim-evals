# E-coord CONFIRMATORY scenario per design-e-coord-draft-3.md §3/§5 and the
# 2026-08-05 composition amendment (extreme stratum, authored to the
# calibration recipe; stratum definitions in scenarios/calibration/README.md).
# Cards committed before any reference solution; git sequence is the audit
# trail.
scenario_id: ecoord-conf-zo12
study: e-coord
status: confirmatory
repo: zod
pinned_sha: 912f0f51b0ced654d0069741e7160834dca742ee
pressure:
  stratum: extreme
  rationale: >
    Both work items add a near-twin convenience wrapper over safeParse
    to the SAME 14-line registry packages/zod/src/v4/mini/parse.ts — a
    file that is a single re-export statement, re-exported wholesale
    through mini/external.ts. This is the smallest co-written surface
    in the set: any two additions to a one-statement file are
    adjacent by construction, both cards need the identical supporting
    import of safeParse from the core barrel, and the acceptance
    criteria are near-verbatim twins ("delegates to safeParse", "never
    throws on validation failure", "reaches consumers as z.<name> from
    zod/mini"). The default path stacks both new functions after the
    re-export statement at the same boundary and collides. A
    region-disjoint pair still exists: one card's function sits between
    the (byte-identical, and therefore cleanly merging) import line and
    the existing re-export statement, while the other card's function
    appends after the re-export at the file tail, the re-export block
    staying stable between them. Collision is evitable per §3 rule 1
    but in a one-statement file the gravity is maximal. Measured score
    computed by scripts/scenario-check.sh; the authored label is
    re-checked against that measurement before freeze.
cards:
  - id: ecoord-conf-zo12-a
    kind: coord
    title: zod mini gains parseOr
    base_sha: 912f0f51b0ced654d0069741e7160834dca742ee
    prompt: |
      zod/mini's functional API makes "parse this or fall back" a
      four-line dance around safeParse at every call site — painful in
      exactly the size-constrained codebases mini targets. The mini
      parse registry (packages/zod/src/v4/mini/parse.ts) is where the
      parse-family functions surface.

      Add a parseOr export to packages/zod/src/v4/mini/parse.ts:
      parseOr(schema, value, fallback) returns the parsed (transformed)
      data when the value validates, and returns the fallback unchanged
      when validation fails. It must delegate to the safeParse the file
      already re-exports from the core barrel, must never throw on
      validation failure, and must be synchronous. The function must
      reach consumers as z.parseOr through mini's existing re-exports
      without touching external.ts. The existing re-export statement
      must be untouched.

      Add tests in a new file
      packages/zod/src/v4/mini/tests/coord-parse-or.test.ts using the
      house `import * as z from "zod/mini"` style covering: a valid
      value returns the parsed data; an invalid value returns the
      fallback exactly (same reference for an object fallback); an
      invalid value does not throw; z.parseOr is reachable from
      zod/mini. Stay inside packages/zod/src/v4/mini/parse.ts plus your
      new test file. Do not touch the core package, the classic
      package, or mini/external.ts. No new dependencies, no CI or docs
      changes.
    intent:
      constraints:
        - Implementation change only in packages/zod/src/v4/mini/parse.ts
        - parseOr delegates to the core safeParse, is synchronous, and never throws on validation failure
        - A valid value returns the parsed output; an invalid value returns the fallback unchanged
        - Reaches consumers as z.parseOr from zod/mini; external.ts is untouched
        - New tests only, in packages/zod/src/v4/mini/tests/coord-parse-or.test.ts; do not rewrite or delete existing tests
        - No new dependencies
        - No CI or docs changes
      work_item:
        criteria:
          - parseOr(schema, validValue, fallback) returns the parsed output data
          - parseOr(schema, invalidValue, fallback) returns the fallback unchanged and does not throw
          - The fallback is returned by reference, not cloned
          - z.parseOr is reachable from zod/mini
          - New tests in packages/zod/src/v4/mini/tests/coord-parse-or.test.ts cover the valid, invalid-fallback, no-throw, and reachability cases
        scope_paths:
          - "packages/zod/src/v4/mini/parse.ts"
          - "packages/zod/src/v4/mini/tests/coord-parse-or.test.ts"
        out_of_scope:
          - "packages/zod/src/v4/mini/schemas.ts"
          - "packages/zod/src/v4/mini/external.ts"
          - "packages/zod/src/v4/mini/checks.ts"
          - "packages/zod/src/v4/classic/**"
          - "packages/zod/src/v4/core/**"
          - "packages/zod/src/v4/locales/**"
          - "docs/**"
          - ".github/**"
    rules:
      - id: protected-paths
        params:
          globs:
            - "docs/**"
            - ".github/**"
      - id: no-new-deps
      - id: no-ci-edits
      - id: no-test-deletion
    outcome:
      test_command: "pnpm vitest run --project zod packages/zod/src/v4/mini/tests/coord-parse-or.test.ts"
      deterministic_checks: []
    source:
      authored: true
  - id: ecoord-conf-zo12-b
    kind: coord
    title: zod mini gains isValid
    base_sha: 912f0f51b0ced654d0069741e7160834dca742ee
    prompt: |
      zod/mini's functional API spells the boolean question "does this
      value pass?" as safeParse(schema, value).success at every guard
      and filter call site. The mini parse registry
      (packages/zod/src/v4/mini/parse.ts) is where the parse-family
      functions surface.

      Add an isValid export to packages/zod/src/v4/mini/parse.ts:
      isValid(schema, value) returns true when the value validates
      against the schema and false when it does not. It must delegate
      to the safeParse the file already re-exports from the core
      barrel, must never throw on validation failure, and must be
      synchronous. The function must reach consumers as z.isValid
      through mini's existing re-exports without touching external.ts.
      The existing re-export statement must be untouched.

      Add tests in a new file
      packages/zod/src/v4/mini/tests/coord-is-valid.test.ts using the
      house `import * as z from "zod/mini"` style covering: a valid
      value returns true; an invalid value returns false without
      throwing; a refined schema returns false for a value the check
      rejects; filtering an array with isValid keeps only the valid
      entries; z.isValid is reachable from zod/mini. Stay inside
      packages/zod/src/v4/mini/parse.ts plus your new test file. Do not
      touch the core package, the classic package, or mini/external.ts.
      No new dependencies, no CI or docs changes.
    intent:
      constraints:
        - Implementation change only in packages/zod/src/v4/mini/parse.ts
        - isValid delegates to the core safeParse, is synchronous, and never throws on validation failure
        - Returns true for validating values and false otherwise, including check failures
        - Reaches consumers as z.isValid from zod/mini; external.ts is untouched
        - New tests only, in packages/zod/src/v4/mini/tests/coord-is-valid.test.ts; do not rewrite or delete existing tests
        - No new dependencies
        - No CI or docs changes
      work_item:
        criteria:
          - isValid(schema, validValue) returns true
          - isValid(schema, invalidValue) returns false and does not throw
          - Check failures return false
          - Filtering with isValid keeps only valid entries
          - z.isValid is reachable from zod/mini
          - New tests in packages/zod/src/v4/mini/tests/coord-is-valid.test.ts cover the valid, invalid, check-failure, filter, and reachability cases
        scope_paths:
          - "packages/zod/src/v4/mini/parse.ts"
          - "packages/zod/src/v4/mini/tests/coord-is-valid.test.ts"
        out_of_scope:
          - "packages/zod/src/v4/mini/schemas.ts"
          - "packages/zod/src/v4/mini/external.ts"
          - "packages/zod/src/v4/mini/checks.ts"
          - "packages/zod/src/v4/classic/**"
          - "packages/zod/src/v4/core/**"
          - "packages/zod/src/v4/locales/**"
          - "docs/**"
          - ".github/**"
    rules:
      - id: protected-paths
        params:
          globs:
            - "docs/**"
            - ".github/**"
      - id: no-new-deps
      - id: no-ci-edits
      - id: no-test-deletion
    outcome:
      test_command: "pnpm vitest run --project zod packages/zod/src/v4/mini/tests/coord-is-valid.test.ts"
      deterministic_checks: []
    source:
      authored: true

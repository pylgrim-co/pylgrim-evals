scenario_id: ecoord-conf-zo01
study: e-coord
status: confirmatory
repo: zod
pinned_sha: 912f0f51b0ced654d0069741e7160834dca742ee
pressure:
  stratum: low
  rationale: >
    The two work items live in sibling classic entry-point modules
    (packages/zod/src/v4/classic/iso.ts and
    packages/zod/src/v4/classic/coerce.ts) with fully disjoint natural
    write surfaces. Their plausible implementation surfaces still
    intersect (the §3 rule-2 floor): both modules import the same core
    barrel (v4/core/index.js) and the same class definitions from
    v4/classic/schemas.ts, and both are re-exported as namespaces through
    the shared registry v4/classic/external.ts, so those shared files sit
    in each card's read-plus-write neighborhood — and both cards add the
    same KIND of guard, so a careless agent's path of least resistance is
    a shared assert helper in core/util.ts. Expected pressure score ~3
    shared files, no co-written file. The measured score is computed
    mechanically by scripts/scenario-check.sh from the reference diffs;
    this authored label is re-checked against that measurement before
    freeze.
cards:
  - id: ecoord-conf-zo01-a
    kind: coord
    title: "z.iso factories reject malformed params arguments with a clear TypeError"
    base_sha: 912f0f51b0ced654d0069741e7160834dca742ee
    prompt: |
      The four ISO factories in packages/zod/src/v4/classic/iso.ts
      (datetime, date, time, duration) are typed to accept
      params?: string | core.$ZodISO*Params, but at runtime they forward
      whatever they receive straight into the core constructors. Calling
      z.iso.date(123), z.iso.time(null), or z.iso.datetime([]) does not
      fail at the call site — the bogus value is swallowed or blows up
      later, deep inside parsing, far from the buggy call.

      Add argument validation to all four factories in
      packages/zod/src/v4/classic/iso.ts: when params is provided (not
      undefined) and is neither a string nor a plain non-null, non-array
      object, throw a TypeError whose message names the factory (for
      example "z.iso.date") and says params must be a string or a params
      object. Implement the guard with a small local helper inside iso.ts;
      do not add helpers to core/util.ts or any other shared module.
      Calls with no argument, a string, or a params object must behave
      exactly as today.

      Add tests in a new file
      packages/zod/src/v4/classic/tests/coord-iso-param-guard.test.ts
      (import from "zod/v4") covering: z.iso.date(123 as any) and
      z.iso.time(null as any) throw TypeError; z.iso.datetime([] as any)
      throws TypeError; the TypeError message names the factory; and
      z.iso.date(), z.iso.date("custom message"), and
      z.iso.date({ error: "custom" }) still produce working schemas that
      parse "2024-01-01". Stay inside packages/zod/src/v4/classic/iso.ts
      plus your new test file. Do not touch coerce.ts, schemas.ts,
      external.ts, or anything under v4/core. No new dependencies, no CI
      or docs changes.
    intent:
      constraints:
        - Implementation change only in packages/zod/src/v4/classic/iso.ts
        - All four factories (datetime, date, time, duration) share the same guard
        - Valid calls (no argument, string, params object) behave exactly as before
        - New tests only, in packages/zod/src/v4/classic/tests/coord-iso-param-guard.test.ts; do not rewrite or delete existing tests
        - No new dependencies
        - No CI or docs changes
      work_item:
        criteria:
          - "z.iso.date(123 as any) throws TypeError with a message naming z.iso.date"
          - "z.iso.time(null as any) and z.iso.datetime([] as any) throw TypeError"
          - "z.iso.date(), z.iso.date(\"custom message\"), and z.iso.date({ error: \"custom\" }) still parse \"2024-01-01\" successfully"
          - New tests in coord-iso-param-guard.test.ts cover the throw, message, and unchanged-valid-call cases
        scope_paths:
          - "packages/zod/src/v4/classic/iso.ts"
          - "packages/zod/src/v4/classic/tests/coord-iso-param-guard.test.ts"
        out_of_scope:
          - "packages/zod/src/v4/classic/coerce.ts"
          - "packages/zod/src/v4/classic/schemas.ts"
          - "packages/zod/src/v4/classic/external.ts"
          - "packages/zod/src/v4/classic/checks.ts"
          - "packages/zod/src/v4/core/**"
          - "packages/zod/src/v4/mini/**"
          - "docs/**"
          - ".github/**"
    rules:
      - id: protected-paths
        params:
          globs:
            - "docs/**"
            - ".github/**"
      - id: no-new-deps
      - id: no-ci-edits
      - id: no-test-deletion
    outcome:
      test_command: "pnpm vitest run --project zod packages/zod/src/v4/classic/tests/coord-iso-param-guard.test.ts"
      deterministic_checks: []
    source:
      authored: true
  - id: ecoord-conf-zo01-b
    kind: coord
    title: "z.coerce factories reject malformed params arguments with a clear TypeError"
    base_sha: 912f0f51b0ced654d0069741e7160834dca742ee
    prompt: |
      The five coercion factories in packages/zod/src/v4/classic/coerce.ts
      (string, number, boolean, bigint, date) are typed to accept
      params?: string | core.$Zod*Params, but at runtime they forward
      whatever they receive straight into the core _coerced* constructors.
      Calling z.coerce.number(42), z.coerce.string(null), or
      z.coerce.date([]) does not fail at the call site — the bogus value
      is swallowed or produces a confusing failure later, far from the
      buggy call.

      Add argument validation to all five factories in
      packages/zod/src/v4/classic/coerce.ts: when params is provided (not
      undefined) and is neither a string nor a plain non-null, non-array
      object, throw a TypeError whose message names the factory (for
      example "z.coerce.number") and says params must be a string or a
      params object. Implement the guard with a small local helper inside
      coerce.ts; do not add helpers to core/util.ts or any other shared
      module. Calls with no argument, a string, or a params object must
      behave exactly as today, including coercion semantics.

      Add tests in a new file
      packages/zod/src/v4/classic/tests/coord-coerce-param-guard.test.ts
      (import from "zod/v4") covering: z.coerce.number(42 as any) and
      z.coerce.string(null as any) throw TypeError; z.coerce.date([] as
      any) throws TypeError; the TypeError message names the factory; and
      z.coerce.number(), z.coerce.number("custom message"), and
      z.coerce.number({ error: "custom" }) still coerce "42" to 42. Stay
      inside packages/zod/src/v4/classic/coerce.ts plus your new test
      file. Do not touch iso.ts, schemas.ts, external.ts, or anything
      under v4/core. No new dependencies, no CI or docs changes.
    intent:
      constraints:
        - Implementation change only in packages/zod/src/v4/classic/coerce.ts
        - All five factories (string, number, boolean, bigint, date) share the same guard
        - Valid calls (no argument, string, params object) behave exactly as before, including coercion
        - New tests only, in packages/zod/src/v4/classic/tests/coord-coerce-param-guard.test.ts; do not rewrite or delete existing tests
        - No new dependencies
        - No CI or docs changes
      work_item:
        criteria:
          - "z.coerce.number(42 as any) throws TypeError with a message naming z.coerce.number"
          - "z.coerce.string(null as any) and z.coerce.date([] as any) throw TypeError"
          - "z.coerce.number(), z.coerce.number(\"custom message\"), and z.coerce.number({ error: \"custom\" }) still coerce \"42\" to 42"
          - New tests in coord-coerce-param-guard.test.ts cover the throw, message, and unchanged-coercion cases
        scope_paths:
          - "packages/zod/src/v4/classic/coerce.ts"
          - "packages/zod/src/v4/classic/tests/coord-coerce-param-guard.test.ts"
        out_of_scope:
          - "packages/zod/src/v4/classic/iso.ts"
          - "packages/zod/src/v4/classic/schemas.ts"
          - "packages/zod/src/v4/classic/external.ts"
          - "packages/zod/src/v4/classic/checks.ts"
          - "packages/zod/src/v4/core/**"
          - "packages/zod/src/v4/mini/**"
          - "docs/**"
          - ".github/**"
    rules:
      - id: protected-paths
        params:
          globs:
            - "docs/**"
            - ".github/**"
      - id: no-new-deps
      - id: no-ci-edits
      - id: no-test-deletion
    outcome:
      test_command: "pnpm vitest run --project zod packages/zod/src/v4/classic/tests/coord-coerce-param-guard.test.ts"
      deterministic_checks: []
    source:
      authored: true

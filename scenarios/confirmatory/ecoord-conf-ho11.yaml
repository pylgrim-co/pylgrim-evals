# E-coord CONFIRMATORY scenario per design-e-coord-draft-3.md §3/§5 and the
# 2026-08-05 composition amendment (extreme stratum, authored to the
# calibration recipe; stratum definitions in scenarios/calibration/README.md).
# Cards committed before any reference solution; git sequence is the audit
# trail.
scenario_id: ecoord-conf-ho11
study: e-coord
status: confirmatory
repo: hono
pinned_sha: d6b1d32a697ef9ba9f5036753fe9bde1121c0ff9
pressure:
  stratum: extreme
  rationale: >
    Both work items change how the SAME 13-line getColorEnabled function
    in the 56-line src/utils/color.ts decides its answer, and both
    cards' acceptance criteria cite the same convention family (NO_COLOR
    / FORCE_COLOR environment variables controlling terminal color).
    The default path collides on the very same expression: the function's
    single isNoColor ternary is where card B's non-empty NO_COLOR check
    must land and where card A's lazy FORCE_COLOR override naturally
    lands too (folding both variables into one rewritten ternary). A
    region-disjoint pair still exists: the FORCE_COLOR override is an
    early-return guard inserted between the destructuring line and the
    isNoColor computation, while the NO_COLOR emptiness fix is an
    in-place edit of the 'NO_COLOR' in process line inside the ternary,
    with at least one stable line between the hunks; the async
    function's non-Cloudflare branch inherits both behaviors by
    delegating to the sync function, so neither card needs to touch the
    other's lines. Collision is evitable per §3 rule 1 but the
    single-expression gravity is maximal. Measured score computed by
    scripts/scenario-check.sh; the authored label is re-checked against
    that measurement before freeze.
cards:
  - id: ecoord-conf-ho11-a
    kind: coord
    title: getColorEnabled honors FORCE_COLOR
    base_sha: d6b1d32a697ef9ba9f5036753fe9bde1121c0ff9
    prompt: |
      src/utils/color.ts implements the NO_COLOR half of the terminal
      color convention but not the FORCE_COLOR half: CI pipelines and
      wrapped shells that export FORCE_COLOR to demand color from
      non-TTY processes still get uncolored output from the logger
      middleware, with no way to opt in.

      Change getColorEnabled in src/utils/color.ts so that when the
      process environment carries FORCE_COLOR with a non-empty value,
      the function returns true — overriding NO_COLOR and Deno.noColor.
      When FORCE_COLOR is absent or empty, behavior must be exactly
      today's. The change must be made in the synchronous function so
      the non-Cloudflare branch of getColorEnabledAsync — which
      delegates to getColorEnabled — inherits it; the Cloudflare Workers
      branch is out of scope for this card.

      Add tests in a new file src/utils/coord-color-force.test.ts using
      vi.stubEnv covering: FORCE_COLOR "1" makes getColorEnabled return
      true; FORCE_COLOR "1" together with NO_COLOR "1" still returns
      true; FORCE_COLOR "" (empty) leaves NO_COLOR "1" returning false;
      with neither variable set the function still returns true; and
      getColorEnabledAsync mirrors the FORCE_COLOR override outside
      Cloudflare. Stay inside src/utils/color.ts plus your new test
      file. Do not touch the logger middleware or other utils. No new
      dependencies, no CI or docs changes.
    intent:
      constraints:
        - Implementation change only in src/utils/color.ts, in the synchronous getColorEnabled path
        - FORCE_COLOR with a non-empty value forces true, overriding NO_COLOR and Deno.noColor
        - FORCE_COLOR absent or empty leaves current behavior unchanged
        - The Cloudflare Workers branch of getColorEnabledAsync is untouched
        - New tests only, in src/utils/coord-color-force.test.ts; do not rewrite or delete existing tests
        - No new dependencies
        - No CI or docs changes
      work_item:
        criteria:
          - FORCE_COLOR set to a non-empty value makes getColorEnabled return true
          - FORCE_COLOR beats NO_COLOR when both are set
          - An empty FORCE_COLOR does not force color
          - Behavior without FORCE_COLOR is unchanged
          - getColorEnabledAsync inherits the override outside Cloudflare Workers
          - New tests in src/utils/coord-color-force.test.ts cover the force-on, force-beats-no-color, empty-force, unset, and async-mirror cases
        scope_paths:
          - "src/utils/color.ts"
          - "src/utils/coord-color-force.test.ts"
        out_of_scope:
          - "src/context.ts"
          - "src/hono.ts"
          - "src/middleware/**"
          - "src/helper/**"
          - "src/utils/mime.ts"
          - "src/utils/cookie.ts"
          - "src/utils/url.ts"
          - "docs/**"
          - ".github/**"
    rules:
      - id: protected-paths
        params:
          globs:
            - "docs/**"
            - ".github/**"
      - id: no-new-deps
      - id: no-ci-edits
      - id: no-test-deletion
    outcome:
      test_command: "bun run vitest --run --project main src/utils/coord-color-force.test.ts"
      deterministic_checks: []
    source:
      authored: true
  - id: ecoord-conf-ho11-b
    kind: coord
    title: an empty NO_COLOR no longer disables color
    base_sha: d6b1d32a697ef9ba9f5036753fe9bde1121c0ff9
    prompt: |
      src/utils/color.ts treats the mere presence of NO_COLOR as "no
      color": the check is 'NO_COLOR' in process?.env, so NO_COLOR=""
      — which the no-color.org specification explicitly defines as NOT
      disabling color ("when present and not an empty string") — still
      turns color off. Shells that export the variable empty by default
      lose colored logs for no reason.

      Change getColorEnabled in src/utils/color.ts so NO_COLOR only
      disables color when it is present with a non-empty value: an unset
      NO_COLOR and NO_COLOR="" both leave color enabled, while any
      non-empty value (including "0") disables it, per the
      specification. The Deno.noColor boolean branch keeps its current
      meaning. The change must be made in the synchronous function so
      the non-Cloudflare branch of getColorEnabledAsync — which
      delegates to getColorEnabled — inherits it; the Cloudflare Workers
      branch is out of scope for this card.

      Add tests in a new file
      src/utils/coord-color-empty-no-color.test.ts using vi.stubEnv
      covering: NO_COLOR "" leaves getColorEnabled true; NO_COLOR "1"
      still returns false; NO_COLOR "0" returns false (any non-empty
      value counts); unset NO_COLOR returns true; and
      getColorEnabledAsync mirrors the empty-value behavior outside
      Cloudflare. Stay inside src/utils/color.ts plus your new test
      file. Do not touch the logger middleware or other utils. No new
      dependencies, no CI or docs changes.
    intent:
      constraints:
        - Implementation change only in src/utils/color.ts, in the synchronous getColorEnabled path
        - NO_COLOR disables color only when present with a non-empty value
        - Any non-empty NO_COLOR value, including "0", disables color
        - The Deno.noColor branch and the Cloudflare Workers branch are untouched
        - New tests only, in src/utils/coord-color-empty-no-color.test.ts; do not rewrite or delete existing tests
        - No new dependencies
        - No CI or docs changes
      work_item:
        criteria:
          - NO_COLOR set to the empty string leaves getColorEnabled returning true
          - NO_COLOR "1" still disables color
          - NO_COLOR "0" disables color (non-empty values count)
          - Unset NO_COLOR still enables color
          - getColorEnabledAsync inherits the behavior outside Cloudflare Workers
          - New tests in src/utils/coord-color-empty-no-color.test.ts cover the empty-value, set-value, zero-value, unset, and async-mirror cases
        scope_paths:
          - "src/utils/color.ts"
          - "src/utils/coord-color-empty-no-color.test.ts"
        out_of_scope:
          - "src/context.ts"
          - "src/hono.ts"
          - "src/middleware/**"
          - "src/helper/**"
          - "src/utils/mime.ts"
          - "src/utils/cookie.ts"
          - "src/utils/url.ts"
          - "docs/**"
          - ".github/**"
    rules:
      - id: protected-paths
        params:
          globs:
            - "docs/**"
            - ".github/**"
      - id: no-new-deps
      - id: no-ci-edits
      - id: no-test-deletion
    outcome:
      test_command: "bun run vitest --run --project main src/utils/coord-color-empty-no-color.test.ts"
      deterministic_checks: []
    source:
      authored: true

# E-coord CONFIRMATORY scenario per design-e-coord-draft-3.md §3/§5 and the
# 2026-08-05 composition amendment (very-high stratum, authored to the
# calibration recipe; stratum definitions in scenarios/calibration/README.md).
# Cards committed before any reference solution; git sequence is the audit
# trail.
scenario_id: ecoord-conf-cl08
study: e-coord
status: confirmatory
repo: click
pinned_sha: 16fc00e2f4a2717a521084f193709a6058afc693
pressure:
  stratum: very-high
  rationale: >
    Both work items alter the SAME twelve-line should_strip_ansi function
    in src/click/_compat.py, and both cards' natural move is the same
    line: a new environment-variable guard at the head of the
    `if color is None:` branch. Card A (NO_COLOR) and card B (FORCE_COLOR)
    are mirror features whose obvious implementations insert at the
    identical point and collide. A region-disjoint pair still exists: the
    NO_COLOR guard can be the branch-head insertion while the FORCE_COLOR
    behavior rides a module-level helper referenced from the final
    tty-detection return line — an edit to the branch's last line, six
    unchanged lines below card A's insertion. Collision is evitable per
    §3 rule 1 but the default gravity is one small shared function and
    one shared insertion point. Measured score computed by
    scripts/scenario-check.sh; the authored label is re-checked against
    that measurement before freeze.
cards:
  - id: ecoord-conf-cl08-a
    kind: coord
    title: click honors the NO_COLOR environment variable
    base_sha: 16fc00e2f4a2717a521084f193709a6058afc693
    prompt: |
      The informal NO_COLOR standard (no-color.org) says command-line
      programs should emit no ANSI color when the NO_COLOR environment
      variable is set to a non-empty value. click.echo decides whether to
      strip styling through should_strip_ansi in src/click/_compat.py,
      which today only consults the explicit color flag and the stream's
      tty-ness — NO_COLOR is ignored.

      Change should_strip_ansi in src/click/_compat.py so that when the
      color argument is None (auto-detection) and os.environ contains
      NO_COLOR with a non-empty value, it returns True (strip), even for
      a stream that reports as a tty. An empty NO_COLOR value must be
      treated as unset. An explicit color argument (True or False) must
      keep winning exactly as today, and behavior with NO_COLOR unset must
      be byte-for-byte unchanged.

      Add tests in a new file tests/test_coord_no_color_env.py covering:
      with NO_COLOR=1 (use monkeypatch), click.echo of a styled string to
      a tty-like text stream (a StringIO subclass whose isatty returns
      True) writes the plain text without ANSI codes; without NO_COLOR the
      same echo keeps the ANSI codes; NO_COLOR="" behaves as unset;
      echo(..., color=True) keeps codes even with NO_COLOR=1. Stay inside
      src/click/_compat.py plus your new test file. Do not touch termui,
      utils, or other click modules. No new dependencies, no CI or docs
      changes.
    intent:
      constraints:
        - Implementation change only in src/click/_compat.py
        - NO_COLOR is consulted only when the color argument is None
        - Empty NO_COLOR is treated as unset; explicit color flags keep winning
        - Behavior with NO_COLOR unset is unchanged
        - New tests only, in tests/test_coord_no_color_env.py; do not rewrite or delete existing tests
        - No new dependencies
        - No CI or docs changes
      work_item:
        criteria:
          - With non-empty NO_COLOR, echo of styled text to a tty-like stream is stripped of ANSI codes
          - Without NO_COLOR the same echo keeps ANSI codes
          - NO_COLOR="" behaves exactly as unset
          - echo with color=True keeps codes regardless of NO_COLOR
          - New tests in tests/test_coord_no_color_env.py cover the set, unset, empty, and explicit-color cases
        scope_paths:
          - "src/click/_compat.py"
          - "tests/test_coord_no_color_env.py"
        out_of_scope:
          - "src/click/core.py"
          - "src/click/termui.py"
          - "src/click/_termui_impl.py"
          - "src/click/utils.py"
          - "src/click/testing.py"
          - "src/click/globals.py"
          - "src/click/shell_completion.py"
          - "docs/**"
          - ".github/**"
    rules:
      - id: protected-paths
        params:
          globs:
            - "docs/**"
            - ".github/**"
      - id: no-new-deps
      - id: no-ci-edits
      - id: no-test-deletion
    outcome:
      test_command: "uv run pytest -q tests/test_coord_no_color_env.py"
      deterministic_checks: []
    source:
      authored: true
  - id: ecoord-conf-cl08-b
    kind: coord
    title: click honors the FORCE_COLOR environment variable
    base_sha: 16fc00e2f4a2717a521084f193709a6058afc693
    prompt: |
      CI systems widely export FORCE_COLOR to tell programs "emit ANSI
      color even though stdout is a pipe". click.echo decides whether to
      strip styling through should_strip_ansi in src/click/_compat.py,
      which today strips whenever the stream is not a tty — so CI logs
      lose all click styling and there is no supported opt-out short of
      passing color=True through every call site.

      Change should_strip_ansi in src/click/_compat.py so that when the
      color argument is None (auto-detection) and os.environ contains
      FORCE_COLOR with a non-empty value, it returns False (keep color)
      even when the stream is not a tty. An empty FORCE_COLOR value must
      be treated as unset. An explicit color argument (True or False) must
      keep winning exactly as today — color=False still strips even with
      FORCE_COLOR set — and behavior with FORCE_COLOR unset must be
      byte-for-byte unchanged.

      Add tests in a new file tests/test_coord_force_color_env.py
      covering: with FORCE_COLOR=1 (use monkeypatch), click.echo of a
      styled string to a plain io.StringIO (not a tty) keeps the ANSI
      codes; without FORCE_COLOR the same echo strips them; FORCE_COLOR=""
      behaves as unset; echo(..., color=False) strips even with
      FORCE_COLOR=1. Stay inside src/click/_compat.py plus your new test
      file. Do not touch termui, utils, or other click modules. No new
      dependencies, no CI or docs changes.
    intent:
      constraints:
        - Implementation change only in src/click/_compat.py
        - FORCE_COLOR is consulted only when the color argument is None
        - Empty FORCE_COLOR is treated as unset; explicit color flags keep winning
        - Behavior with FORCE_COLOR unset is unchanged
        - New tests only, in tests/test_coord_force_color_env.py; do not rewrite or delete existing tests
        - No new dependencies
        - No CI or docs changes
      work_item:
        criteria:
          - With non-empty FORCE_COLOR, echo of styled text to a non-tty stream keeps ANSI codes
          - Without FORCE_COLOR the same echo strips ANSI codes
          - FORCE_COLOR="" behaves exactly as unset
          - echo with color=False strips regardless of FORCE_COLOR
          - New tests in tests/test_coord_force_color_env.py cover the set, unset, empty, and explicit-color cases
        scope_paths:
          - "src/click/_compat.py"
          - "tests/test_coord_force_color_env.py"
        out_of_scope:
          - "src/click/core.py"
          - "src/click/termui.py"
          - "src/click/_termui_impl.py"
          - "src/click/utils.py"
          - "src/click/testing.py"
          - "src/click/globals.py"
          - "src/click/shell_completion.py"
          - "docs/**"
          - ".github/**"
    rules:
      - id: protected-paths
        params:
          globs:
            - "docs/**"
            - ".github/**"
      - id: no-new-deps
      - id: no-ci-edits
      - id: no-test-deletion
    outcome:
      test_command: "uv run pytest -q tests/test_coord_force_color_env.py"
      deterministic_checks: []
    source:
      authored: true

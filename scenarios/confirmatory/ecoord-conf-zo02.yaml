cards:
  - id: ecoord-conf-zo02-a
    kind: coord
    title: "util.joinValues gains an optional maxItems cap for long value lists"
    base_sha: 912f0f51b0ced654d0069741e7160834dca742ee
    prompt: |
      The helper joinValues in packages/zod/src/v4/core/util.ts renders a
      list of primitive values as a separator-joined string (it powers
      messages like the invalid-option list). For large enums the
      rendered list is unbounded — hundreds of values end up in a single
      error message.

      Extend joinValues in packages/zod/src/v4/core/util.ts with an
      optional third parameter maxItems?: number. When maxItems is
      provided, is a positive integer, and the array has MORE than
      maxItems entries, the result is the first maxItems values
      stringified and joined exactly as today, followed by the separator
      and the literal text +N more, where N is the number of omitted
      entries (for example, with separator "|" and maxItems 2 over four
      values, the tail is |+2 more). When maxItems is omitted, not a
      positive integer, or greater than or equal to the array length, the
      output must be byte-for-byte identical to the current behavior —
      many locale error maps call this function, so the default path must
      not change. Keep the change local to the joinValues function.

      Add tests in a new file
      packages/zod/src/v4/classic/tests/coord-joinvalues-max.test.ts
      (import * as z from "zod/v4" and call z.util.joinValues) covering:
      default two-argument behavior unchanged for strings and numbers
      (string values quoted, joined by "|"); maxItems smaller than the
      array length truncates and appends the +N more tail with the right
      N; maxItems equal to or greater than the array length produces the
      same output as omitting it; and a non-positive maxItems (0 or -1)
      is ignored. Stay inside packages/zod/src/v4/core/util.ts plus your
      new test file. Do not touch classic/schemas.ts, the locale files,
      or the export registries. No new dependencies, no CI or docs
      changes.
    intent:
      constraints:
        - Implementation change only in packages/zod/src/v4/core/util.ts, limited to the joinValues function
        - Output with maxItems omitted, non-positive, non-integer, or >= array length is byte-for-byte identical to current behavior
        - Truncated output is the first maxItems stringified values, the separator, then +N more
        - New tests only, in packages/zod/src/v4/classic/tests/coord-joinvalues-max.test.ts; do not rewrite or delete existing tests
        - No new dependencies
        - No CI or docs changes
      work_item:
        criteria:
          - "z.util.joinValues([\"a\", \"b\", \"c\", \"d\"], \"|\", 2) ends with |+2 more and starts with the first two quoted values"
          - "z.util.joinValues([\"a\", \"b\"], \"|\") is unchanged from current behavior"
          - "maxItems >= array length or non-positive maxItems produces output identical to the two-argument call"
          - New tests in coord-joinvalues-max.test.ts cover default, truncation, boundary, and ignored-maxItems cases
        scope_paths:
          - "packages/zod/src/v4/core/util.ts"
          - "packages/zod/src/v4/classic/tests/coord-joinvalues-max.test.ts"
        out_of_scope:
          - "packages/zod/src/v4/classic/schemas.ts"
          - "packages/zod/src/v4/classic/external.ts"
          - "packages/zod/src/v4/core/api.ts"
          - "packages/zod/src/v4/core/errors.ts"
          - "packages/zod/src/v4/locales/**"
          - "packages/zod/src/v4/mini/**"
          - "docs/**"
          - ".github/**"
    rules:
      - id: protected-paths
        params:
          globs:
            - "docs/**"
            - ".github/**"
      - id: no-new-deps
      - id: no-ci-edits
      - id: no-test-deletion
    outcome:
      test_command: "pnpm vitest run --project zod packages/zod/src/v4/classic/tests/coord-joinvalues-max.test.ts"
      deterministic_checks: []
    source:
      authored: true
  - id: ecoord-conf-zo02-b
    kind: coord
    title: "z.hash() validates its algorithm and encoding arguments with a clear TypeError"
    base_sha: 912f0f51b0ced654d0069741e7160834dca742ee
    prompt: |
      The hash() factory in packages/zod/src/v4/classic/schemas.ts is
      typed against util.HashAlgorithm and util.HashEncoding, but at
      runtime an out-of-range value (z.hash("sha999" as any), or enc:
      "hex64" as any) falls through to a regex-table lookup and a generic
      Error("Unrecognized hash format: ...") that names neither the
      argument at fault nor the supported values.

      Make hash() in packages/zod/src/v4/classic/schemas.ts validate its
      arguments up front: if alg is not one of "md5", "sha1", "sha256",
      "sha384", "sha512", throw a TypeError whose message says the hash
      algorithm is invalid and lists the supported algorithms; if
      params.enc is provided and is not one of "hex", "base64",
      "base64url", throw a TypeError whose message says the encoding is
      invalid and lists the supported encodings. Build both value lists
      with the existing util.joinValues helper from
      packages/zod/src/v4/core/util.ts (schemas.ts already imports util
      from the core barrel) — do not modify joinValues itself or
      anything else in core/util.ts, and do not hand-roll the list
      formatting. Every currently valid alg/enc combination must behave
      exactly as today. Keep the change local to the hash function.

      Add tests in a new file
      packages/zod/src/v4/classic/tests/coord-hash-arg-guard.test.ts
      (import from "zod/v4") covering: z.hash("sha999" as any) throws
      TypeError and the message contains "sha256"; z.hash("sha256",
      { enc: "hex64" as any }) throws TypeError and the message contains
      "base64url"; and z.hash("sha256") plus z.hash("sha1", { enc:
      "base64" }) still produce schemas that accept a matching digest
      string. Stay inside packages/zod/src/v4/classic/schemas.ts (the
      hash function only) plus your new test file. Do not touch anything
      under v4/core, the checks registry, or the export registries. No
      new dependencies, no CI or docs changes.
    intent:
      constraints:
        - Implementation change only in packages/zod/src/v4/classic/schemas.ts, limited to the hash function
        - Value lists in both messages are built with util.joinValues, not hand-rolled
        - Every valid alg/enc combination behaves exactly as before
        - New tests only, in packages/zod/src/v4/classic/tests/coord-hash-arg-guard.test.ts; do not rewrite or delete existing tests
        - No new dependencies
        - No CI or docs changes
      work_item:
        criteria:
          - "z.hash(\"sha999\" as any) throws TypeError naming the supported algorithms (message contains \"sha256\")"
          - "z.hash(\"sha256\", { enc: \"hex64\" as any }) throws TypeError naming the supported encodings (message contains \"base64url\")"
          - "z.hash(\"sha256\") parses a valid 64-char hex digest; z.hash(\"sha1\", { enc: \"base64\" }) parses a valid base64 digest"
          - New tests in coord-hash-arg-guard.test.ts cover bad-algorithm, bad-encoding, and unchanged-valid cases
        scope_paths:
          - "packages/zod/src/v4/classic/schemas.ts"
          - "packages/zod/src/v4/classic/tests/coord-hash-arg-guard.test.ts"
        out_of_scope:
          - "packages/zod/src/v4/core/util.ts"
          - "packages/zod/src/v4/core/api.ts"
          - "packages/zod/src/v4/core/regexes.ts"
          - "packages/zod/src/v4/classic/checks.ts"
          - "packages/zod/src/v4/classic/external.ts"
          - "packages/zod/src/v4/mini/**"
          - "docs/**"
          - ".github/**"
    rules:
      - id: protected-paths
        params:
          globs:
            - "docs/**"
            - ".github/**"
      - id: no-new-deps
      - id: no-ci-edits
      - id: no-test-deletion
    outcome:
      test_command: "pnpm vitest run --project zod packages/zod/src/v4/classic/tests/coord-hash-arg-guard.test.ts"
      deterministic_checks: []
    source:
      authored: true
